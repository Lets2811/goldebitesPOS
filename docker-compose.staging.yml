# Staging: a separate copy of Golden Bites for demos, on the same VM as
# production but sharing nothing with it — its own database, uploads and
# secrets. Run as its own Compose project (`-p gbstaging`, see
# deploy/deploy-staging.sh) from /opt/golden-bites/staging.
#
# No ports are published: production's nginx (GB/nginx.conf) answers
# https://staging.goldenbites.net and forwards it, over the shared `gb_edge`
# network, to this stack's frontend, which serves the app and proxies /api to
# this stack's backend.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./GB-BE
      target: production
    env_file: .env.staging
    environment:
      DB_HOST: postgres
    volumes:
      - staging_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./GB
      args:
        VITE_API_BASE_URL: /api/v1
        # Shows the STAGING chip in the app.
        VITE_APP_ENV: staging
        VITE_TURA_APP_URL: https://tura-staging.goldenbites.net
        # From .env.staging (deploy-staging.sh passes it as --env-file).
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        NGINX_CONF: nginx.staging.conf
    networks:
      default:
      edge:
        # The name production's nginx forwards staging.goldenbites.net to.
        aliases: [gb-staging-web]
    depends_on:
      - backend
    restart: unless-stopped

  # TURA, the assistant (TURA/README.md): its service and its app, at
  # https://tura-staging.goldenbites.net. It reads this stack's POS through
  # the backend's API with the user's own token, never its database.
  tura-api:
    build:
      context: ./TURA/api
    env_file: .env.tura.staging
    environment:
      NODE_ENV: production
      PORT: 3100
      POS_API_TARGET: prod
      POS_API_URL_PROD: http://backend:3000/api/v1
      CORS_ORIGIN: https://tura-staging.goldenbites.net
    volumes:
      - staging_tura_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  tura-web:
    build:
      context: ./TURA/app
    networks:
      default:
      edge:
        # The name production's nginx forwards tura-staging.goldenbites.net to.
        aliases: [gb-staging-tura]
    depends_on:
      - backend
      - tura-api
    restart: unless-stopped

  # POS-ADMIN, the Golden Bites team's Admin (POS-ADMIN/README.md), at
  # https://admin-staging.goldenbites.net. Its API signs the team in and does
  # everything about businesses through this backend's internal API.
  admin-api:
    build:
      context: ./POS-ADMIN/api
    env_file: .env.admin.staging
    environment:
      NODE_ENV: production
      PORT: 3200
      CORS_ORIGIN: https://admin-staging.goldenbites.net
      POS_INTERNAL_URL: http://backend:3000/api/v1/internal
      # TURA_ADMIN_KEY goes in the env file, with the same value as TURA's.
      TURA_API_URL: http://tura-api:3100
      DB_HOST: postgres
    depends_on:
      - backend
    restart: unless-stopped

  admin-web:
    build:
      context: ./POS-ADMIN/app
      args:
        VITE_APP_ENV: staging
        VITE_TURA_APP_URL: https://tura-staging.goldenbites.net
    networks:
      default:
      edge:
        # The name production's nginx forwards admin-staging.goldenbites.net to.
        aliases: [gb-staging-admin]
    depends_on:
      - admin-api
    restart: unless-stopped

networks:
  edge:
    name: gb_edge
    external: true

volumes:
  staging_pg_data:
  staging_uploads:
  staging_tura_data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - golden_bites_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./GB-BE
      target: production
    env_file: .env.production
    environment:
      DB_HOST: postgres
    volumes:
      - golden_bites_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./GB
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      default:
      # Shared with staging's frontend (docker-compose.staging.yml), which this
      # nginx forwards staging.goldenbites.net to.
      edge:
    depends_on:
      - backend
    restart: unless-stopped

networks:
  # Created by deploy/deploy.sh and deploy/deploy-staging.sh if missing.
  edge:
    name: gb_edge
    external: true

volumes:
  golden_bites_pg_data:
  golden_bites_uploads:
  certbot_webroot:
  certbot_certs:

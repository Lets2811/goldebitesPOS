server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (product photos, logo, purchase receipts): nginx's 1 MB default
    # refused anything bigger before it reached the backend, which enforces
    # its own per-file limits (up to 10 MB, plus room for the multipart wrapping).
    client_max_body_size 12m;

    # Without this, every JS/CSS asset ships uncompressed — the main bundle
    # alone is ~3x heavier over the wire than it needs to be.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/font-woff
        application/font-woff2
        image/svg+xml;

    # Swagger is disabled in production (see GB-BE/src/main.ts), block it here too as defense in depth.
    location = /api/v1/api/docs {
        return 403;
    }

    # The internal API is for POS-ADMIN on the private network only, never from outside.
    location /api/v1/internal/ {
        return 404;
    }

    # Let's Encrypt HTTP-01 challenge — must be served as-is, before the SPA
    # catch-all below would otherwise swallow it and return index.html.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes every filename in here — a new deploy always ships
    # new hashes, so caching these aggressively can never serve stale content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

# HTTPS, added alongside the HTTP server above (no redirect yet — that lands
# in a follow-up deploy once this is confirmed reachable from the internet,
# so a firewall/DNS hiccup never takes down the site entirely).
server {
    listen 443 ssl;
    server_name goldenbites.net www.goldenbites.net;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/goldenbites.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenbites.net/privkey.pem;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/font-woff
        application/font-woff2
        image/svg+xml;

    location = /api/v1/api/docs {
        return 403;
    }

    # The internal API is for POS-ADMIN on the private network only, never from outside.
    location /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

# ---------------------------------------------------------------------------
# Staging (docker-compose.staging.yml): a separate copy for demos, same VM.
# This nginx owns ports 80/443, so it answers staging.goldenbites.net and
# forwards it over the shared `gb_edge` network to staging's own frontend,
# which serves the app and its own /api.
#
# The upstream is a variable resolved per request through Docker's DNS, so
# production starts and serves normally even when staging is down (staging
# just answers 502 then).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name staging.goldenbites.net;

    # Let's Encrypt HTTP-01 challenge for the staging certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.goldenbites.net;

    ssl_certificate     /etc/letsencrypt/live/staging.goldenbites.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.goldenbites.net/privkey.pem;

    client_max_body_size 12m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $staging_upstream http://gb-staging-web:80;

    location / {
        proxy_pass $staging_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TURA in staging (docker-compose.staging.yml: tura-web), forwarded the same
# way as staging above. Its answers stream as server-sent events, so this hop
# must not buffer them either.
server {
    listen 80;
    server_name tura-staging.goldenbites.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tura-staging.goldenbites.net;

    ssl_certificate     /etc/letsencrypt/live/tura-staging.goldenbites.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tura-staging.goldenbites.net/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tura_staging_upstream http://gb-staging-tura:80;

    location / {
        proxy_pass $tura_staging_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# Production's TURA and POS-ADMIN (docker-compose.prod.yml: tura-web,
# admin-web) and staging's POS-ADMIN (admin-web on gb_edge). Same pattern as
# staging above: TLS ends here, the upstream is resolved per request, so this
# nginx starts and serves even when one of them is down (it answers 502).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name tura.goldenbites.net admin.goldenbites.net admin-staging.goldenbites.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tura.goldenbites.net;

    ssl_certificate     /etc/letsencrypt/live/tura.goldenbites.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tura.goldenbites.net/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tura_upstream http://tura-web:80;

    location / {
        proxy_pass $tura_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # TURA's answers stream as server-sent events: pass them on as they come.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name admin.goldenbites.net;

    ssl_certificate     /etc/letsencrypt/live/admin.goldenbites.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.goldenbites.net/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_upstream http://admin-web:80;

    location / {
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin-staging.goldenbites.net;

    ssl_certificate     /etc/letsencrypt/live/admin-staging.goldenbites.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-staging.goldenbites.net/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_staging_upstream http://gb-staging-admin:80;

    location / {
        proxy_pass $admin_staging_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TURA's app. Plain HTTP on the private `gb_edge` network: TLS ends at
# production's nginx (GB/nginx.conf), which forwards TURA's hostname here.
#
# Same routes as the Vite dev server (vite.config.ts): the browser calls both
# backends as same-origin relative paths, so no CORS is involved —
# /api is the POS (GB-BE, of this same Compose project) and /tura the assistant.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/octet-stream
        image/svg+xml;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Only what TURA uses of the POS: linking the app and swapping its token.
    # The assistant reaches the rest of the POS server-side, never through here.
    location /api/v1/tura-links/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        return 404;
    }

    # What TURA costs and which tools it has are for the Golden Bites Admin,
    # which asks tura-api directly on the private network: never from here.
    location /tura/admin/ {
        return 404;
    }

    location /tura/ {
        proxy_pass http://tura-api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Answers stream as server-sent events: pass each one on as it comes.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

# POS-ADMIN app. Plain HTTP on the private network: TLS ends at production's
# nginx (GB/nginx.conf), which forwards the Admin's hostname here. The app
# calls its API as a same-origin path, proxied to POS-ADMIN/api.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /admin-api/ {
        proxy_pass http://admin-api:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
